spring:
  # General
  application:
    name: api-messaging

  # Flyway
  flyway:
    enabled: true
    group: true

  # RabbitMQ. Correlated confirms and returns are what let a publish be waited on, which the whole path depends on:
  # nothing is acked until the broker has taken responsibility for what was published in its place.
  # observation-enabled feeds Actuator's timer metrics for publish and receive. Instrumentation is not environment
  # config - only the exporter is - and the path is hardest to follow in the environments where it cannot be watched
  # in a terminal. Nothing in dept44 wires a tracer, so this yields metrics, not spans linking a request to the
  # outcome it produced.
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    # No RabbitAdmin, and never a Declarable bean. The AMQP user has an empty configure permission by design, so an
    # attempt to declare a queue fails with ACCESS_REFUSED and the listener container never starts - while
    # /actuator/health stays green, because the Rabbit health indicator below is deliberately off. That combination is
    # a consumer that is silently not consuming, with messages piling up and nothing saying so.
    dynamic: false
    template:
      mandatory: true
      observation-enabled: true
    listener:
      simple:
        observation-enabled: true
        # A message in flight holds its attachments in memory for the length of the delivery, so heap here is bounded
        # by concurrency multiplied by the attachment cap rather than by anything the broker does. Boot's default
        # prefetch is 250, which would also charge 250 messages a delivery-limit count each on a single crash.
        # This applies per listener container, and there are now eight of them - four work queues and four give-up
        # queues - so the ceiling is that much higher than when only SMS and e-mail were queued.
        prefetch: 1
        concurrency: 2
        max-concurrency: 4

  # JPA
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        integrator_provider: se.sundsvall.messaging.integration.db.projection.support.ClassImportIntegratorIntegratorProvider

# Postportal's outgoing channels over RabbitMQ: requests in from postportal, one terminal outcome back out.
# Connection settings (spring.rabbitmq.host/port/virtual-host/username/password) are supplied per environment and are
# not committed here. Object names are the contract with postportal and are declared by the messaging-topology-operator
# via GitOps - the AMQP user has an empty configure permission, so this service must never declare any of them.
rabbitmq:
  enabled: false
  # One block per channel. The object names are the contract with postportal; retry-tiers is not - postportal waits for
  # a terminal outcome and never sees the ladder that produced it, so the timing is messaging's alone. Three tiers means
  # four delivery attempts, after which the request is routed to the channel's dead key.
  sms:
    work-queue: api-fabriken.messaging.sms
    give-up-queue: api-fabriken.messaging.sms.giveup
    retry-exchange: api-fabriken.messaging.retry
    dead-routing-key: dead
    status-exchange: api-fabriken.messaging.status
    sent-routing-key: sms.sent
    failed-routing-key: sms.failed
    retry-tiers: 5s,30s,5m
  email:
    work-queue: api-fabriken.messaging.email
    # A separate exchange rather than more keys on the SMS one: that exchange is direct, so tiers bound on the same
    # 5s/30s/5m keys would each receive a copy of the other channel's retries.
    retry-exchange: api-fabriken.messaging.email.retry
    give-up-queue: api-fabriken.messaging.email.giveup
    # Likewise its own dead key - SMS's give-up queue is consumed, so a shared key would have that listener eat this
    # channel's give-up event and report it as an SMS failure.
    dead-routing-key: email.dead
    status-exchange: api-fabriken.messaging.status
    sent-routing-key: email.sent
    failed-routing-key: email.failed
    retry-tiers: 5s,30s,5m
  digital-mail:
    work-queue: api-fabriken.messaging.digital-mail
    retry-exchange: api-fabriken.messaging.digital-mail.retry
    give-up-queue: api-fabriken.messaging.digital-mail.giveup
    # Hyphen, never a dot. The status exchange is a topic exchange where "." separates words and "*" matches exactly
    # one of them, so "digital.mail.sent" would be three words and the bindings would start matching the wrong things.
    dead-routing-key: digital-mail.dead
    status-exchange: api-fabriken.messaging.status
    sent-routing-key: digital-mail.sent
    failed-routing-key: digital-mail.failed
    retry-tiers: 5s,30s,5m
  snail-mail:
    work-queue: api-fabriken.messaging.snail-mail
    retry-exchange: api-fabriken.messaging.snail-mail.retry
    give-up-queue: api-fabriken.messaging.snail-mail.giveup
    dead-routing-key: snail-mail.dead
    status-exchange: api-fabriken.messaging.status
    sent-routing-key: snail-mail.sent
    failed-routing-key: snail-mail.failed
    retry-tiers: 5s,30s,5m
  publish-confirm-timeout-seconds: 5

# Do not let the broker's reachability gate service health; an unreachable broker shows up as unacked messages.
management:
  health:
    rabbit:
      enabled: false

# OpenAPI
openapi:
  title: Messaging
  name: messaging
  version: '@project.version@'

# Logbook filtering
logbook:
  body-filters:
    json-path:
      - key: '$..attachments[*].content'
        value: '[base64]'
      - key: '$..attachments[*].base64Data'
        value: '[base64]'
      - key: '$..attachments[*].body'
        value: '[base64]'
      - key: '$..files[*].body'
        value: '[base64]'

# Attachment handling
messaging:
  attachment:
    # Matches object store's own per-object ceiling, so there is one number to remember rather than two: a request may
    # carry one full-size attachment, or several smaller ones adding up to the same.
    max-total-size: 15MB

resilience4j.bulkhead:
  instances:
    attachmentResolver:
      # Four at a time, because each one in flight costs several times its own size in transient heap. Multiply this by
      # max-total-size to get the memory this service can be holding in attachments, and size the pod against that.
      # Tomcat's two hundred threads are what this exists to stop from all fetching at once.
      max-concurrent-calls: 4
      # Fail rather than queue. A caller waiting on a full bulkhead is a thread held open, which is the resource being
      # protected in the first place.
      max-wait-duration: 0

resilience4j.circuitbreaker:
  instances:
    DigitalMailSender:
      ignore-exceptions:
        - se.sundsvall.dept44.exception.ClientProblem
    Party:
      ignore-exceptions:
        - se.sundsvall.dept44.exception.ClientProblem
    ContactSettings:
      ignore-exceptions:
        - se.sundsvall.dept44.exception.ClientProblem
    ObjectStore:
      # An unknown or expired object is ordinary traffic against a store whose objects have a time to live, not a sign
      # the store is unwell. Without this a handful of expired attachments trips the breaker for everyone.
      ignore-exceptions:
        - se.sundsvall.dept44.exception.ClientProblem
      # The default breaker counts exceptions only, so a call that returns 200 after fourteen seconds is recorded as a
      # success and the breaker stays shut - blind to the failure that actually takes this service down, since every
      # attachment read holds a Tomcat thread for its duration. These two lines are what make "slow" openable.
      slow-call-duration-threshold: 2s
      slow-call-rate-threshold: 50
 
