spring:
  # General
  application:
    name: api-messaging

  # Flyway
  flyway:
    enabled: true
    group: true

  # JPA
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        integrator_provider: se.sundsvall.messaging.integration.db.projection.support.ClassImportIntegratorIntegratorProvider

# RabbitMQ SMS mirror (fire-and-forget side channel).
# Connection settings (spring.rabbitmq.host/port/virtual-host/username/password) are supplied
# per environment (secrets / cluster env), not committed here. Enable per environment.
# The AMQP user has no configure permission: never declare queues/exchanges/bindings.
rabbitmq:
  producer:
    enabled: false
    exchange: api-fabriken.messaging
    routing-key: sms

# Do not let the broker's reachability gate service health - publishing is fire-and-forget.
management:
  health:
    rabbit:
      enabled: false

# OpenAPI
openapi:
  title: Messaging
  name: messaging
  version: '@project.version@'

# Logbook filtering
logbook:
  body-filters:
    json-path:
      - key: '$..attachments[*].content'
        value: '[base64]'
      - key: '$..attachments[*].base64Data'
        value: '[base64]'
      - key: '$..attachments[*].body'
        value: '[base64]'
      - key: '$..files[*].body'
        value: '[base64]'

resilience4j.circuitbreaker:
  instances:
    DigitalMailSender:
      ignore-exceptions:
        - se.sundsvall.dept44.exception.ClientProblem
    Party:
      ignore-exceptions:
        - se.sundsvall.dept44.exception.ClientProblem
    ContactSettings:
      ignore-exceptions:
        - se.sundsvall.dept44.exception.ClientProblem
 
